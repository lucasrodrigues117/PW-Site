<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>L. Rodrigues - Portfolio</title>
</head>
<body>
    <div class="main-login">
        <div class="left-login">
            <h1>Faça login <br><span>E entre para conhecer mais.</span></h1>
            <img src="images/programming.svg" class="left-login-image" alt="Programming Animation">
        </div>
        <div class="right-login">
            <div class="card-login">
                <h1>LOGIN</h1>
                <div class="textfield">
                    <label for="usuario">Usuário</label>
                    <input type="text" name="usuario" placeholder="Usuário">
                </div>
                <div class="textfield">
                    <label for="senha">Senha</label>
                    <input type="password" name="senha" placeholder="Senha">
                </div>
                <button class="btn-login"><a href="index.html">LOGIN</a></button>
            </div>
        </div>
    </div>
</body>
</html>
